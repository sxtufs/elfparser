name: Build ELFTrace

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned so the clippy/fmt gates can't start failing when stable moves.
          toolchain: 1.93.1
          targets: aarch64-linux-android
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: elftrace-core
          shared-key: "elftrace-android-arm64"

      # Lint/format gates run before the NDK download so a style regression
      # fails in seconds instead of after a 700 MB toolchain fetch.
      - name: Rust format check
        run: cd elftrace-core && cargo fmt --check

      - name: Rust lint (clippy)
        run: cd elftrace-core && cargo clippy --all-targets -- -D warnings

      # Cache the installed cargo-ndk binary so we don't recompile it from
      # source on every run (rust-cache does not cover `cargo install` bins).
      - name: Cache cargo-ndk binary
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
          add-to-path: true

      - name: Build Rust core for arm64-v8a
        run: |
          set -euo pipefail
          cd elftrace-core
          cargo ndk -t arm64-v8a -p 24 -o ../app/src/main/jniLibs build --release
          cd ..
          test -f app/src/main/jniLibs/arm64-v8a/libelftrace.so || {
            echo "ERROR: cargo ndk did not produce libelftrace.so"
            exit 1
          }

      - name: Install AArch64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Build the propagation clone fixture so propagation_tests does not
      # self-skip in CI. Writes into the checkout (always writable) and exports
      # ELFTRACE_FIXTURES_DIR for the test step below. Produces
      # elftrace-core/test_fixtures/accuracy/fx_a64_clones.so with two
      # byte-identical exported functions (clone_a, clone_b).
      - name: Build propagation test fixtures
        run: |
          set -euo pipefail
          export ELFTRACE_FIXTURES_DIR="$GITHUB_WORKSPACE/elftrace-core/test_fixtures/accuracy"
          chmod +x elftrace-core/tests/fixtures_src/build_clones.sh
          elftrace-core/tests/fixtures_src/build_clones.sh "$ELFTRACE_FIXTURES_DIR"
          ls -la "$ELFTRACE_FIXTURES_DIR/fx_a64_clones.so"
          echo "ELFTRACE_FIXTURES_DIR=$ELFTRACE_FIXTURES_DIR" >> "$GITHUB_ENV"

      - name: Run Rust tests
        run: |
          set -uo pipefail
          cd elftrace-core
          # Many tests skip gracefully when fixtures are absent (real APK .so files
          # aren't checked into the repo). Tests that CAN run here include:
          #   - audit_tests: pure-logic tests (patcher, resolvers, malformed ELF)
          #   - accuracy_tests: lifter/codegen tests using ElfContext::stub()
          #   - self-compile gate + batch E end-to-end (find the .so built above)
          # A failed test here blocks the APK build — that's the point.
          cargo test --all -- --test-threads=1

      - name: Verify .so — size, exports, stripped
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          SO=app/src/main/jniLibs/arm64-v8a/libelftrace.so

          echo "=== Size ==="
          ls -la "$SO"
          SIZE=$(stat -c%s "$SO")
          echo "Bytes: $SIZE ($((SIZE/1024/1024)) MB)"
          # Catches both a missing-strip regression and dependency bloat (the
          # stripped artifact is ~8 MB; unstripped is far larger). The stripped
          # check below is authoritative for strip, so growth here means code
          # was added — check dependency features before raising this.
          # NOTE: the release profile intentionally uses panic="unwind" (not "abort")
          # so the JNI bridge can catch panics; that adds ~500 KB of unwind tables.
          if [ "$SIZE" -gt 12582912 ]; then
            echo "ERROR: .so > 12 MB — either strip is off (see stripped check) or code grew; check dependency features"
            exit 1
          fi

          echo "=== JNI exports survived strip (must be >= 10) ==="
          EXPORTS=$("$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --dyn-syms "$SO" | grep -c "Java_io_elftrace_app_core_JNIBridge" || true)
          echo "Found $EXPORTS JNI exports"
          if [ "$EXPORTS" -lt 10 ]; then
            echo "ERROR: expected >= 10 JNI exports after strip, found $EXPORTS"
            exit 1
          fi

          echo "=== Internal Rust symbols stripped (must be 0) ==="
          INTERNAL=$("$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --syms "$SO" 2>/dev/null | grep -c "core::fmt\|alloc::vec" || true)
          echo "Internal symbols found: $INTERNAL (must be 0)"
          if [ "$INTERNAL" -ne 0 ]; then
            echo "ERROR: strip did not remove .symtab"
            exit 1
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Kotlin unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        env:
          # Monotonic per push so each artifact installs as an update.
          ELFT_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify .so inside APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Checking $APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libelftrace.so" || {
            echo "ERROR: libelftrace.so not packaged in APK"
            exit 1
          }
          UNZIPPED_SIZE=$(unzip -p "$APK" lib/arm64-v8a/libelftrace.so | wc -c)
          ON_DISK_SIZE=$(stat -c%s app/src/main/jniLibs/arm64-v8a/libelftrace.so)
          if [ "$UNZIPPED_SIZE" -ne "$ON_DISK_SIZE" ]; then
            echo "ERROR: APK .so size ($UNZIPPED_SIZE) != built .so size ($ON_DISK_SIZE)"
            exit 1
          fi
          echo "APK .so verified: $UNZIPPED_SIZE bytes"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ELFTrace-Release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (On Tag)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The MCP server is a desktop binary, not part of the APK, so it needs its own
  # build per OS: an agent client on macOS or Windows cannot use a Linux binary,
  # and a macOS binary can only be produced on a macOS runner.
  mcp:
    name: Build elftrace-mcp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Pull requests don't need binaries; main-branch pushes and tags do.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: elftrace-core
          shared-key: "elftrace-mcp-${{ matrix.os }}"

      - name: Build elftrace-mcp
        shell: bash
        working-directory: elftrace-core
        run: set -euo pipefail; cargo build --release --bin elftrace-mcp

      - name: Stage and smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp elftrace-core/target/release/elftrace-mcp.exe dist/
            ./dist/elftrace-mcp.exe --version
          else
            cp elftrace-core/target/release/elftrace-mcp dist/
            ./dist/elftrace-mcp --version
          fi

      # Proves the binary really speaks MCP on stdio, not just that it links.
      - name: Smoke-test the stdio protocol
        shell: bash
        run: |
          set -euo pipefail
          BIN=./dist/elftrace-mcp
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./dist/elftrace-mcp.exe; fi
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "$BIN" > responses.jsonl
          grep -q '"serverInfo"' responses.jsonl
          grep -q '"elf_info"' responses.jsonl
          echo "stdio session answered initialize and tools/list"

      - name: Upload elftrace-mcp
        uses: actions/upload-artifact@v4
        with:
          name: elftrace-mcp-${{ matrix.os }}
          path: dist/*
