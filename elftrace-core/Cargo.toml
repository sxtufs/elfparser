[package]
name = "elftrace"
version = "1.0.0"
edition = "2021"

[lib]
name = "elftrace"
crate-type = ["cdylib", "rlib"]

[dependencies]
object = { version = "0.32", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = "0.19"
capstone = "0.12"
thiserror = "1.0"
cpp_demangle = "0.4"
rhai = "1.19"

[profile.release]
# Remove internal symbol names (Rust function/type names).
# Keeps .dynsym (exported JNI symbols) — required for Android JNI loading.
strip = "symbols"

# Thin LTO: cross-crate inlining. Fast compile, most of the size/optimization benefit.
lto = "thin"

# Single codegen unit: better optimization, slower compile. CI has time.
codegen-units = 1

# Unwind on panic so the JNI bridge can catch panics with catch_unwind and
# convert them into JSON error strings instead of aborting the whole app.
# Trade-off: keeps unwinding tables (~500 KB). Robustness against malformed
# /adversarial ELF input is worth it for an on-device analysis tool.
panic = "unwind"
