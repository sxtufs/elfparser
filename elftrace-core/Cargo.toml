[package]
name = "elftrace"
version = "1.0.0"
edition = "2021"

[lib]
name = "elftrace"
crate-type = ["cdylib", "rlib"]

[dependencies]
object = { version = "0.41", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = "0.21"
capstone = "0.14"
thiserror = "2.0"
cpp_demangle = "0.5"
rhai = "1.26"

[profile.release]
# Remove internal symbol names (Rust function/type names).
# Keeps .dynsym (exported JNI symbols) — required for Android JNI loading.
strip = "symbols"

# Fat LTO: full cross-crate inlining + dead-code elimination. Slower to link
# (build-time only) but yields smaller code AND better i-cache behaviour, so
# runtime is speed-neutral-to-faster. Strictly a win for a CPU-bound tool.
lto = "fat"

# Single codegen unit: better optimization, slower compile. CI has time.
codegen-units = 1

# Unwind on panic so the JNI bridge can catch panics with catch_unwind and
# convert them into JSON error strings instead of aborting the whole app.
# Trade-off: keeps unwinding tables (~500 KB). Robustness against malformed
# /adversarial ELF input is worth it for an on-device analysis tool.
panic = "unwind"
