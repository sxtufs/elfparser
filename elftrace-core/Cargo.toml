[package]
name = "elftrace"
version = "1.0.0"
edition = "2021"

[lib]
name = "elftrace"
crate-type = ["cdylib", "rlib"]

[features]
# Off by default: the default build uses the hand-written VirtualCpu so CI and
# release APKs are unaffected. Enable to swap the execution core to Unicorn.
default = []
engine-unicorn = ["dep:unicorn-engine"]

[build-dependencies]
# Used by build.rs to compile the __clear_cache shim for Android (Unicorn JIT).
cc = "1"

[dependencies]
object = { version = "0.32", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jni = "0.19"
capstone = "0.12"
thiserror = "1.0"
cpp_demangle = "0.4"
# Optional, enabled by the `engine-unicorn` feature. QEMU-derived CPU core
# (arm64/arm32/x86/x86_64) with real memory mapping and hooks.
unicorn-engine = { version = "2.0", optional = true }

[profile.release]
# Remove internal symbol names (Rust function/type names).
# Keeps .dynsym (exported JNI symbols) — required for Android JNI loading.
strip = "symbols"

# Thin LTO: cross-crate inlining. Fast compile, most of the size/optimization benefit.
lto = "thin"

# Single codegen unit: better optimization, slower compile. CI has time.
codegen-units = 1

# Abort on panic instead of unwinding. Two benefits:
#   1. Removes unwinding tables (~500 KB savings)
#   2. Prevents a Rust panic from unwinding across the JNI boundary
panic = "abort"
